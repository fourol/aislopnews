services:
  bot:
    build: .
    container_name: aislopnews-bot
    restart: unless-stopped
    env_file:
      - .env
    command: python main.py --schedule
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml

  panel:
    build: .
    container_name: aislopnews-panel
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn panel:app --host 0.0.0.0 --port 8888
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    depends_on:
      - bot
